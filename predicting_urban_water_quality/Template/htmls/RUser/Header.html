<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote User</title>
<link href="https://fonts.googleapis.com/css?family=Russo+One" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

/* ============================================================
   Predicting Urban Water Quality - visual layer
   Palette taken from water treatment: marine depth, clear
   current, foam, and a mineral amber reserved for measured
   readings. CSS only; no markup was changed. The legacy
   bgcolor / border / width attributes and inline styles are
   neutralised by the selectors further down.
   ============================================================ */

:root{
  --abyss:#06202c;
  --depth:#0c3547;
  --current:#0f7f8c;
  --current-dark:#0b626d;
  --foam:#5fd4c8;
  --paper:#f6fafb;
  --paper-alt:#eaf3f5;
  --slate:#24424f;
  --slate-soft:#5b7684;
  --mineral:#c9791d;
  --line:#d4e4e8;
  --display:'Space Grotesk','Segoe UI',sans-serif;
  --body:'IBM Plex Sans','Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 18px 40px -18px rgba(3,20,28,.55);
}

*,*::before,*::after{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1100px 620px at 12% -12%, #175a6e 0%, transparent 62%),
    radial-gradient(880px 520px at 92% -4%, #0d6d74 0%, transparent 58%),
    linear-gradient(180deg,#06202c 0%,#092b3b 48%,#051d28 100%);
  background-attachment:fixed;
  background-repeat:no-repeat;
  color:#d9eaf0;
  font-family:var(--body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---------- page title ------------------------------------ */
h1{
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(1.1rem,2.4vw,1.75rem);
  letter-spacing:-.01em;
  line-height:1.3;
  color:#eaf7f9;
  max-width:60ch;
  margin:2.4rem auto 1.1rem;
  padding:0 1.5rem;
  text-align:center;
}
/* the waterline under the title - the one loud moment */
h1::after{
  content:"";
  display:block;
  width:132px;
  height:3px;
  margin:1.1rem auto 0;
  border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--current) 22%,var(--foam) 62%,transparent);
}

h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;color:var(--slate);}

a{color:var(--foam);text-decoration:none;}
a:hover{text-decoration:underline;}

/* ---------- layout ---------------------------------------- */
.container-fluid{
  width:100%;
  max-width:1220px;
  margin:0 auto;
  padding:1.4rem 1.5rem 3.5rem !important;
}
.container{
  width:100%;
  max-width:100%;
  background:var(--paper) !important;
  color:var(--slate);
  border-radius:14px;
  padding:2rem 2rem 2.2rem !important;
  box-shadow:var(--shadow);
  border-top:3px solid var(--current);
  overflow-x:auto;
}
.mainholder{display:block;}
.row{display:block;margin:0;}
.col-md-5,.col-md-2{width:100%;max-width:100%;padding:0;flex:none;}
.col-md-2:empty{display:none;}

/* ---------- navigation ------------------------------------ */
.topnav{
  display:flex;
  flex-wrap:wrap;
  gap:.4rem;
  justify-content:center;
  max-width:1220px;
  margin:0 auto;
  padding:.5rem 1.5rem 0;
  background:transparent;
  overflow:visible;
}
.topnav a{
  float:none;
  font-family:var(--body);
  font-size:.82rem;
  font-weight:500;
  color:#cfe7ec;
  padding:.5rem .85rem;
  border-radius:999px;
  border:1px solid rgba(139,196,208,.28);
  background:rgba(255,255,255,.05);
  text-decoration:none;
  transition:background .18s ease,border-color .18s ease,color .18s ease;
}
.topnav a:hover{
  background:var(--current);
  border-color:var(--current);
  color:#fff;
  text-decoration:none;
}
.topnav a.active{background:var(--current);border-color:var(--current);color:#fff;}

/* remote-user nav sits in a bootstrap alert */
.alert{
  display:flex;
  flex-wrap:wrap;
  gap:.45rem;
  justify-content:center;
  align-items:center;
  max-width:1220px;
  margin:0 auto 1.2rem;
  padding:.7rem 1rem !important;
  background:rgba(255,255,255,.05) !important;
  border:1px solid rgba(139,196,208,.24) !important;
  border-radius:12px;
  color:#cfe7ec !important;
  font-weight:500 !important;
}
.alert a{
  color:#cfe7ec;
  font-size:.84rem;
  padding:.4rem .8rem;
  border-radius:999px;
  border:1px solid transparent;
}
.alert a:hover{background:var(--current);color:#fff;text-decoration:none;}
.alert h2{color:#eaf7f9;margin:0;font-size:clamp(1rem,2vw,1.4rem);}

/* ---------- headings inside cards ------------------------- */
.text-uppercase,.pull-center{font-family:var(--display) !important;}
p.style1,p.text-uppercase{
  font-family:var(--display) !important;
  font-size:1.05rem;
  font-weight:600;
  color:var(--slate) !important;
  letter-spacing:0;
  margin:0 0 .2rem;
}
.style1{color:var(--current-dark);font-weight:600;}
h1.style1{color:#eaf7f9;}
/* the numbered legacy classes only carried colour - let cells decide */
.style2,.style3,.style4,.style5,.style6,.style7,.style8,.style9,
.style10,.style12,.style19,.style22,.style23{
  color:inherit;
  font-size:inherit;
  font-family:inherit;
}

hr{
  border:0;
  height:1px;
  background:var(--line);
  margin:1rem 0 1.4rem;
}

fieldset{border:0;margin:0;padding:0;min-width:0;}
form{margin:0;}

/* ---------- tables ---------------------------------------- */
table{
  width:100%;
  margin:0 auto 1.2rem;
  border-collapse:separate;
  border-spacing:0;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  font-size:.92rem;
  background:#fff;
}
table[border]{border:1px solid var(--line);}
td[width],th[width],td[height],th[height]{width:auto;height:auto;}

th,td{
  padding:.72rem .9rem;
  text-align:left;
  vertical-align:middle;
  border:0;
  border-bottom:1px solid var(--line);
  font-weight:400;
}
tr:last-child td,tr:last-child th{border-bottom:0;}
td div[align],th div[align]{text-align:left;}

/* label + header cells (were bgcolor #FF0000 / #FFFF00 / #0000FF) */
th,
td[bgcolor="#FF0000"]:not([style]),
td[bgcolor="#FFFF00"],
td[bgcolor="#0000FF"]{
  background:var(--depth) !important;
  color:#dff0f3 !important;
  font-family:var(--body) !important;
  font-size:.78rem !important;
  font-weight:600 !important;
  letter-spacing:.01em;
  border-bottom:1px solid rgba(255,255,255,.09);
  white-space:nowrap;
}
th{background:var(--current-dark) !important;}
th *,
td[bgcolor="#FF0000"]:not([style]) *,
td[bgcolor="#FFFF00"] *,
td[bgcolor="#0000FF"] *{color:inherit !important;font-size:inherit !important;font-family:inherit !important;}

/* data cells (were bgcolor #FFFFFF, or inline fantasy/red) */
td[bgcolor="#FFFFFF"],
td[style*="fantasy"]{
  background:#fff !important;
  color:var(--slate) !important;
  font-family:var(--body) !important;
  font-size:.92rem !important;
  font-weight:400 !important;
}
td[bgcolor="#FFFFFF"] *,
td[style*="fantasy"] *{color:inherit !important;font-size:inherit !important;font-family:inherit !important;}
tbody tr:nth-child(even) td[bgcolor="#FFFFFF"],
tbody tr:nth-child(even) td[style*="fantasy"]{background:var(--paper) !important;}

/* measured values - the only place mineral amber and mono appear */
td[style*="monospace"]{
  background:#fff !important;
  color:var(--mineral) !important;
  font-family:var(--mono) !important;
  font-size:.95rem !important;
  font-weight:600 !important;
  font-variant-numeric:tabular-nums;
}
td[style*="monospace"] *{color:inherit !important;font-family:inherit !important;font-size:inherit !important;}

/* the single prediction readout on Predict Water Quality */
td[height="68"]{
  background:linear-gradient(135deg,#0d3446,#0f6f7c) !important;
  color:#fff !important;
  font-family:var(--display) !important;
  font-size:1.25rem !important;
  font-weight:600 !important;
  letter-spacing:.01em;
  text-align:center;
}
td[height="68"] *{color:inherit !important;font-family:inherit !important;font-size:inherit !important;}

/* ---------- form controls --------------------------------- */
input[type=text],input[type=password],input[type=email],
input[type=number],select,textarea{
  width:100%;
  max-width:340px;
  font-family:var(--body);
  font-size:.92rem;
  color:var(--slate);
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:.55rem .75rem;
  transition:border-color .18s ease,box-shadow .18s ease;
}
textarea{min-height:64px;resize:vertical;}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--current);
  box-shadow:0 0 0 3px rgba(15,127,140,.18);
}
input::placeholder,textarea::placeholder{color:#9ab3bd;}

input[type=submit],button,.btn{
  display:inline-block;
  width:auto;
  font-family:var(--body);
  font-size:.9rem;
  font-weight:600;
  color:#fff !important;
  background:var(--current);
  border:1px solid var(--current);
  border-radius:8px;
  padding:.6rem 1.5rem;
  cursor:pointer;
  transition:background .18s ease,transform .12s ease;
}
input[type=submit]:hover,button:hover,.btn:hover{background:var(--current-dark);}
input[type=submit]:active,button:active,.btn:active{transform:translateY(1px);}
input[type=submit].style1{color:#fff !important;}
.btn-primary,.btn-lg{background:var(--current);border-color:var(--current);}
button:empty{display:none;}

:focus-visible{outline:2px solid var(--foam);outline-offset:2px;}

/* ---------- odds and ends --------------------------------- */
.tweettext{
  width:100% !important;
  max-width:100%;
  height:auto !important;
  min-height:120px;
  overflow:auto !important;
  border:1px dashed var(--line) !important;
  border-radius:10px;
  background:var(--paper);
}
.viewclients{overflow-x:auto;}
img{max-width:100%;height:auto;border-radius:10px;}
small,.text-muted{color:var(--slate-soft) !important;}

@media (max-width:820px){
  .container{padding:1.3rem !important;}
  .container-fluid{padding:1rem .9rem 2.5rem !important;}
  table{font-size:.85rem;}
  th,td{padding:.55rem .6rem;}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;}
}

		</style>
